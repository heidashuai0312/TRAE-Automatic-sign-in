name: Auto Daily Checkin (Trae & WorkBuddy)

on:
  schedule:
    # 每天北京时间 06:30（UTC 22:30）运行
    - cron: "30 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run checkin
        env:
          RANDOM_DELAY_MAX: "900"
          TRAE_SESSION: ${{ secrets.TRAE_SESSION }}
          TRAE_DEVICE_ID: ${{ secrets.TRAE_DEVICE_ID }}
          TRAE_SESSION_2: ${{ secrets.TRAE_SESSION_2 }}
          TRAE_DEVICE_ID_2: ${{ secrets.TRAE_DEVICE_ID_2 }}
          TRAE_SESSION_3: ${{ secrets.TRAE_SESSION_3 }}
          TRAE_DEVICE_ID_3: ${{ secrets.TRAE_DEVICE_ID_3 }}
          TRAE_SESSION_4: ${{ secrets.TRAE_SESSION_4 }}
          TRAE_DEVICE_ID_4: ${{ secrets.TRAE_DEVICE_ID_4 }}
          WORKBUDDY_TOKEN: ${{ secrets.WORKBUDDY_TOKEN }}
          WORKBUDDY_REFRESH_TOKEN: ${{ secrets.WORKBUDDY_REFRESH_TOKEN }}
          WORKBUDDY_UID: ${{ secrets.WORKBUDDY_UID }}
          WORKBUDDY_TOKEN_2: ${{ secrets.WORKBUDDY_TOKEN_2 }}
          WORKBUDDY_REFRESH_TOKEN_2: ${{ secrets.WORKBUDDY_REFRESH_TOKEN_2 }}
          WORKBUDDY_UID_2: ${{ secrets.WORKBUDDY_UID_2 }}
          WORKBUDDY_TOKEN_3: ${{ secrets.WORKBUDDY_TOKEN_3 }}
          WORKBUDDY_REFRESH_TOKEN_3: ${{ secrets.WORKBUDDY_REFRESH_TOKEN_3 }}
          WORKBUDDY_UID_3: ${{ secrets.WORKBUDDY_UID_3 }}
          WORKBUDDY_TOKEN_4: ${{ secrets.WORKBUDDY_TOKEN_4 }}
          WORKBUDDY_REFRESH_TOKEN_4: ${{ secrets.WORKBUDDY_REFRESH_TOKEN_4 }}
          WORKBUDDY_UID_4: ${{ secrets.WORKBUDDY_UID_4 }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: python checkin.py
